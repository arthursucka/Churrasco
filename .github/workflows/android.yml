name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e build de debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # A partir daqui, só quando uma tag vX.Y é enviada.
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$app" ]; then
            echo "::error::A tag v$tag não bate com versionName $app em app/build.gradle.kts"
            exit 1
          fi

      - name: Preparar assinatura
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build de release assinada
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "churrasco-release-${GITHUB_REF_NAME}.apk"

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "churrasco-release-${GITHUB_REF_NAME}.apk" \
            --title "Churrasco $GITHUB_REF_NAME" --generate-notes --latest

      - name: Guardar APK de debug
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: churrasco-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
